<!DOCTYPE html>
<html ng-app="alertApp">
<head>
    <title>ng-click Example</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="AlertController">

    <h2>Click Button to See Alert</h2>
    <button ng-click="showAlert()">Click Me</button>

    <script>
        angular.module('alertApp', [])
        .controller('AlertController', ['$scope', function($scope) {
            $scope.showAlert = function() {
                alert("Hello! You clicked the button.");
            };
        }]);
    </script>
</body>
</html>
